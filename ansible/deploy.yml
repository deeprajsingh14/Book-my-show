---
- name: Deploy Book-My-Show application to Amazon EKS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: "us-east-1"
    eks_cluster_name: "kastro-eks"

    deployment_name: "bms-app"
    container_name: "bms-container"

    ecr_repository: "685459860804.dkr.ecr.us-east-1.amazonaws.com/bookmyshow"

  tasks:

    - name: Configure kubectl for EKS cluster
      ansible.builtin.command:
        cmd: aws eks update-kubeconfig --region {{ aws_region }} --name {{ eks_cluster_name }}
      changed_when: true

    - name: Update Kubernetes deployment image
      ansible.builtin.command:
        cmd: kubectl set image deployment/{{ deployment_name }} {{ container_name }}={{ ecr_repository }}:{{ image_tag }}
      changed_when: true

    - name: Wait for Kubernetes rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/{{ deployment_name }} --timeout=180s
      changed_when: false

    - name: Verify Kubernetes deployment
      ansible.builtin.command:
        cmd: kubectl get deployment {{ deployment_name }}
      register: deployment_status
      changed_when: false

    - name: Show deployment status
      ansible.builtin.debug:
        var: deployment_status.stdout

    - name: Verify running pods
      ansible.builtin.command:
        cmd: kubectl get pods -o wide
      register: pod_status
      changed_when: false

    - name: Show pod status
      ansible.builtin.debug:
        var: pod_status.stdout

    - name: Verify LoadBalancer service
      ansible.builtin.command:
        cmd: kubectl get svc bms-service
      register: service_status
      changed_when: false

    - name: Show LoadBalancer service
      ansible.builtin.debug:
        var: service_status.stdout
